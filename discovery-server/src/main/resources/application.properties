spring.application.name=discovery-server
server.port=8761

# Este é o próprio registro: não se registra em si mesmo nem baixa o registro de terceiros
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Ajustes para desenvolvimento/demonstração: os padrões do Eureka são calibrados
# para produção (cache de 30s, self-preservation, evicção lenta), o que faz um
# serviço derrubado continuar aparecendo como disponível por minutos.
eureka.server.response-cache-update-interval-ms=5000
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000

# Actuator: health usado pelo healthcheck do Docker Compose
management.endpoints.web.exposure.include=health,info
