services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petclinicdb
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petclinic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria as databases dos outros serviços na primeira inicialização do volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petclinic} -d petclinicdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-petclinic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-petclinic}
    ports:
      - "5672:5672"
      - "15672:15672"  # UI — http://localhost:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Registro de serviços: precisa estar de pé antes dos demais para que se registrem
  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  # Monolito (contexto Patient Registry): owners + pets.
  # Produtor de eventos pet.* e owner.* — não consome nada.
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petclinicdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petclinic}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-petclinic}
      EUREKA_URL: http://discovery-server:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-petclinic}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petclinic}
    ports:
      - "8081:8081"

  # Microsserviço (contexto Scheduling): consome pet.*/owner.* para manter sua
  # projeção local e publica appointment.* — consumidor e produtor ao mesmo tempo.
  appointment-service:
    build: ./appointment-service
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appointmentsdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petclinic}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-petclinic}
      EUREKA_URL: http://discovery-server:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-petclinic}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petclinic}
    ports:
      - "8082:8082"

  # Ponto único de entrada da API
  api-gateway:
    build: ./api-gateway
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:8080"

volumes:
  pgdata:
  rabbitdata:
