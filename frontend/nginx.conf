server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gateway on the compose network. O gateway é o único
    # ponto de entrada: ele decide se a rota vai para o monolito ou para o
    # appointment-service, então o frontend não conhece nenhum backend diretamente.
    # Forward the original Host *with port* ($http_host, not $host) so the
    # backend sees this as a same-origin request and doesn't reject it as CORS.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
