# Nome lógico usado no registro Eureka e nas rotas lb:// do gateway
spring.application.name=appointment-service
server.port=8082

# H2 in-memory datasource (banco próprio do microsserviço)
spring.datasource.url=jdbc:h2:mem:appointmentsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Service discovery (Eureka)
# EUREKA_ENABLED=false permite rodar o serviço isolado, sem o discovery-server.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# Renovação mais frequente que o padrão (30s/90s) para que a saída de uma
# instância seja percebida rapidamente em desenvolvimento
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5

# OpenFeign: timeouts curtos para que uma queda do monolito vire 503 rápido,
# em vez de segurar a requisição do usuário até o timeout padrão.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Actuator: health usado pelo healthcheck do Docker Compose
management.endpoints.web.exposure.include=health,info
