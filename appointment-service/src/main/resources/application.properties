# Nome lógico do serviço: aparece em todo log (logging.pattern) e nomeia o cliente Feign
spring.application.name=appointment-service
server.port=8082

# H2 in-memory datasource (banco próprio do microsserviço)
spring.datasource.url=jdbc:h2:mem:appointmentsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# OpenFeign: timeouts curtos para que uma queda do monolito vire 503 rápido,
# em vez de segurar a requisição do usuário até o timeout padrão.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Actuator: health usado pelas probes do Kubernetes
management.endpoints.web.exposure.include=health,info

# Mensageria (RabbitMQ) — Scheduling é consumidor E produtor de eventos
petclinic.events.enabled=${EVENTS_ENABLED:true}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:petclinic}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:petclinic}

spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5

spring.rabbitmq.listener.simple.prefetch=10

spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]
