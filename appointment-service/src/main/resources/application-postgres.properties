# PostgreSQL profile (activate with SPRING_PROFILES_ACTIVE=postgres)
# Aponta para appointmentsdb — database própria do microsserviço, criada pelo
# script docker/postgres/init/01-create-appointments-db.sql.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointmentsdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petclinic}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:petclinic}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Persist schema across restarts (create-drop from the base profile is overridden)
spring.jpa.hibernate.ddl-auto=update
