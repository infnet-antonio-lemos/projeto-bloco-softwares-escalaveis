spring.application.name=api-gateway
server.port=8080

# Rotas: os alvos são URLs diretas. Em Kubernetes, o valor injetado é o nome do
# Service (`http://backend:8081`), que o DNS do cluster resolve para o ClusterIP — e o
# kube-proxy balanceia entre os pods. Não há service discovery na aplicação: quem
# descobre é a plataforma. Ver docs/tp5.md §5.6.
# O default aponta para localhost, para o serviço rodar fora de um cluster.
spring.cloud.gateway.server.webmvc.routes[0].id=petclinic-backend
spring.cloud.gateway.server.webmvc.routes[0].uri=${BACKEND_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/owners/**,/api/pets/**

spring.cloud.gateway.server.webmvc.routes[1].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/appointments/**

# Actuator: health usado pelas probes do Kubernetes.
# Não há endpoint `gateway` aqui: a variante WebMVC do Spring Cloud Gateway (5.0.2) não
# traz um — /actuator/gateway/routes só existe na variante reativa. Quem garante que as
# rotas foram lidas do properties é o ApiGatewayApplicationTests.
management.endpoints.web.exposure.include=health,info

# Probes do Kubernetes: expõe /actuator/health/liveness e /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
