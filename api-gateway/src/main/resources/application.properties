spring.application.name=api-gateway
server.port=8080

# Service discovery (Eureka)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# Padrão é 30s: um serviço reiniciado ficaria até meio minuto invisível para o
# gateway. 5s encurta a janela de convergência, útil em desenvolvimento e demo.
eureka.client.registry-fetch-interval-seconds=5

# Rotas: os alvos são nomes lógicos (lb://), resolvidos em instâncias concretas
# pelo Spring Cloud LoadBalancer a partir do registro do Eureka.
spring.cloud.gateway.server.webmvc.routes[0].id=petclinic-backend
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://petclinic-backend
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/owners/**,/api/pets/**

spring.cloud.gateway.server.webmvc.routes[1].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://appointment-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/appointments/**

# Actuator: health usado pelo healthcheck do Docker Compose;
# gateway expõe as rotas efetivamente carregadas para inspeção/demonstração.
management.endpoints.web.exposure.include=health,info,gateway
