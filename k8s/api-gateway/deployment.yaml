# Ponto único de entrada. É o componente que mais se beneficia de escalar
# horizontalmente: sem estado, recebe todo o tráfego externo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api-gateway
          image: petclinic/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: petclinic-config
          # Três probes com papéis distintos — confundi-los é a origem da maioria
          # dos CrashLoopBackOff em aplicações JVM:
          #
          # startup: cobre a partida lenta da JVM. Enquanto ela não passa, as outras
          #   duas ficam suspensas. Sem ela, a liveness mataria o pod no meio do boot,
          #   num laço infinito de reinícios.
          # readiness: decide se o Service manda tráfego. Falhar aqui tira o pod do
          #   balanceamento sem reiniciá-lo — é o que se quer numa dependência
          #   temporariamente degradada.
          # liveness: decide se o processo precisa ser reiniciado. Deve reprovar
          #   apenas em deadlock ou estado irrecuperável.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # requests guia o escalonador na escolha do nó; limits protege os vizinhos.
            # A JVM lê o limit via cgroup por causa do MaxRAMPercentage no Dockerfile —
            # sem limit definido, ela dimensionaria o heap pela RAM do nó inteiro.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            # Raiz somente-leitura exige um volume gravável para o java.io.tmpdir:
            # o Tomcat embarcado extrai arquivos temporários na partida.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
