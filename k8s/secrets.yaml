# ATENÇÃO — credenciais de demonstração, em texto puro.
#
# Em produção este arquivo não existiria no repositório: os valores viriam de um
# External Secrets Operator, Sealed Secrets ou do gerenciador de segredos do provedor
# (AWS Secrets Manager, GCP Secret Manager). Secret do Kubernetes é apenas base64 —
# codificação, não criptografia — e qualquer um com acesso de leitura ao namespace
# consegue decodificar.
#
# Está aqui em claro porque o objetivo é que a stack suba com um único comando na
# avaliação. `stringData` evita o base64 manual e mantém o arquivo legível.
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-credentials
type: Opaque
stringData:
  POSTGRES_USER: petclinic
  POSTGRES_PASSWORD: petclinic
  RABBITMQ_USER: petclinic
  RABBITMQ_PASSWORD: petclinic
