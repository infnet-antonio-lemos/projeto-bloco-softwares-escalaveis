apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  # A UI de gerenciamento é parte da demonstração, por isso exposta por NodePort.
  # A porta AMQP (5672) fica só no ClusterIP: quem publica e consome está no cluster.
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
      nodePort: 30672
