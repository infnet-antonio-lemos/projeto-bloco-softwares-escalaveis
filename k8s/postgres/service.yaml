# Headless (clusterIP: None): o DNS devolve o IP do pod diretamente, sem passar por
# um balanceador. É o que dá a cada réplica de um StatefulSet um endereço estável
# (postgres-0.postgres), necessário quando houver replicação.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
