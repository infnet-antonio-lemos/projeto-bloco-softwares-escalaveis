# PostgreSQL profile (activate with SPRING_PROFILES_ACTIVE=postgres)
# Overrides the H2 datasource from application.properties.
# Env-var placeholders with localhost defaults so it also runs on the host.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petclinicdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petclinic}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:petclinic}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Persist schema across restarts (create-drop from the base profile is overridden)
spring.jpa.hibernate.ddl-auto=update

# H2 console is irrelevant under Postgres
spring.h2.console.enabled=false
