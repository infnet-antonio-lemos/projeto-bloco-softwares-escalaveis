# Nome lógico usado no registro Eureka e nas rotas lb:// do gateway
spring.application.name=petclinic-backend

# O gateway assumiu a 8080; o monolito passou a ser um serviço interno
server.port=8081

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:petclinicdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate Envers (histórico/auditoria)
# Guarda o último estado da entidade na revisão de DELETE (rastreabilidade de exclusões)
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Service discovery (Eureka)
# EUREKA_ENABLED=false permite rodar o monolito isolado, sem o discovery-server.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# Renovação mais frequente que o padrão (30s/90s) para que a saída de uma
# instância seja percebida rapidamente em desenvolvimento
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator: apenas health/info, usado pelo healthcheck do Docker Compose
management.endpoints.web.exposure.include=health,info
