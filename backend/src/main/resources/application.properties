# Nome lógico do serviço: aparece em todo log (logging.pattern) e nomeia o cliente Feign
spring.application.name=petclinic-backend

# O gateway assumiu a 8080; o monolito passou a ser um serviço interno
server.port=8081

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:petclinicdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate Envers (histórico/auditoria)
# Guarda o último estado da entidade na revisão de DELETE (rastreabilidade de exclusões)
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Actuator: apenas health/info, usado pelas probes do Kubernetes
management.endpoints.web.exposure.include=health,info

# Mensageria (RabbitMQ) 
petclinic.events.enabled=${EVENTS_ENABLED:true}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:petclinic}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:petclinic}

spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.rabbitmq.connection-timeout=5s

management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]
