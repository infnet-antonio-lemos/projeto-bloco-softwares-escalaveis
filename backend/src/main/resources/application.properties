spring.application.name=petclinic

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:petclinicdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate Envers (histórico/auditoria)
# Guarda o último estado da entidade na revisão de DELETE (rastreabilidade de exclusões)
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
